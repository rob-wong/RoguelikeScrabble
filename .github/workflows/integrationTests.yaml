name: Android CI (Production)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  instrumentation-tests:
    runs-on: macos-latest # Use the standard, reliable Intel-based runner

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install coreutils (for gtimeout)
        run: brew install coreutils

      - name: Set up Android SDK PATH
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        shell: bash

      - name: Install SDK components and Create AVD
        env:
          # This fixes the Java 11+ JAXB issue for sdkmanager
          _JAVA_OPTIONS: "-XX:+IgnoreUnrecognizedVMOptions --add-modules java.xml.bind,java.xml.ws.annotation"
        run: |
          # ✅ THE CRITICAL FIX: Install and use the x86_64 system image
          echo "y" | sdkmanager --install "system-images;android-30;google_apis;x86_64" "emulator" "platform-tools"
          # ✅ Create an x86_64 AVD to match the Intel host runner
          echo no | avdmanager create avd --force -n test --package "system-images;android-30;google_apis;x86_64" --abi "google_apis/x86_64"

      - name: Launch Emulator and Monitor in Background
        run: |
          echo "--- Starting Emulator in background ---"
          nohup emulator \
            -avd test \
            -no-snapshot \
            -no-window \
            -no-boot-anim \
            -no-audio \
            -gpu auto \
            -verbose \
            > emulator-log.txt 2>&1 &
          
          sleep 15
          echo "--- Waiting for emulator to boot (max 10 mins) ---"
          gtimeout 600 adb wait-for-device
          BOOT_RESULT=$?
          
          echo "--- Final ADB Devices Status ---"
          adb devices
          echo "--- Dumping emulator log ---"
          cat emulator-log.txt
          
          if [ $BOOT_RESULT -ne 0 ]; then
            echo "!!! CRITICAL: 'adb wait-for-device' timed out. Emulator is not responsive. !!!"
            exit 1
          else
            echo "--- Emulator booted successfully, disabling animations ---"
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
          fi

      - name: Run instrumentation tests
        run: ./gradlew connectedCheck

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/
