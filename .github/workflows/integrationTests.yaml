name: Android Instrumentation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android-tests:
    # Use Ubuntu, which is a reliable x86_64 environment
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The android-emulator-runner action handles SDK installation automatically.
      # Manual setup is not needed and can cause conflicts.

      - name: 🧪 Run tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # --- Configuration aligned for stability ---

          # 1. API Level: Consistent API level. 30 is a very stable choice.
          api-level: 30

          # 2. Target: Use a headless image for CI. 'aosp_atd' is best, 'google_apis' is good.
          target: google_apis

          # 3. Architecture: MUST be x86_64 to match the ubuntu-latest runner
          arch: x86_64

          # 4. Emulator Options: Critical for headless CI environments
          #    -gpu swiftshader_indirect: A reliable software renderer.
          #    -no-snapshot: Prevents loading from a potentially corrupt state.
          emulator-options: -no-window -no-snapshot -no-boot-anim -no-audio -gpu swiftshader_indirect

          # 5. Let the action handle animations. `disable-animations` is more reliable than manual adb commands.
          disable-animations: true

          # 6. Gradle Command: This is the command to run *after* the emulator is fully booted and stable.
          script: |
            chmod +x ./gradlew
            ./gradlew connectedCheck --stacktrace

