
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  instrumentation-tests:
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: AVD Caching
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/system-images/
          key: avd-30 # Use a key that matches your API level

      # This is the step to modify
      - name: Create and run Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          # ✅ FIX 1: Increase the boot timeout significantly
          boot-timeout: 600 # 600 seconds = 10 minutes
          # ✅ FIX 2: Add script commands to prepare the environment
          script: |
            echo "Disabling animations and enabling hardware acceleration..."
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
            echo "Emulator is ready."

      - name: Run instrumentation tests
        # ✅ FIX 3: Add a retry mechanism for flaky connections
        uses: wca-actions/run-command@v1
        with:
          command: ./gradlew connectedCheck
          retries: 2 # Retry the command up to 2 times if it fails

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/