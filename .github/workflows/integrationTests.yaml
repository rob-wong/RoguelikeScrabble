name: Android CI (Production)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  instrumentation-tests:
    runs-on: macos-latest

    steps:
      - name: 🧩 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🧰 Install dependencies
        run: |
          brew install coreutils || true
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: ⚙️ Set up Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          # ✅ Download latest command line tools
          curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-mac-10406996_latest.zip
          unzip -q commandlinetools.zip
          rm commandlinetools.zip
          mv cmdline-tools latest
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          source $GITHUB_PATH || true

          yes | sdkmanager --licenses || true
          sdkmanager --update
          sdkmanager "platform-tools" "emulator" "system-images;android-30;google_apis;arm64-v8a" "platforms;android-30"
      

      - name: 🧼 Kill all existing ADB daemons
        run: |
          echo "Killing any existing adb processes..."
          pkill -9 adb || true
          adb kill-server || true
          sleep 2
          echo "--- ADB versions found ---"
          which -a adb || true

      - name: 📱 Create and start AVD
        run: |
          echo no | avdmanager create avd --force -n test --package "system-images;android-30;google_apis;arm64-v8a" --abi arm64-v8a
          echo "--- Emulator config ---"
          cat ~/.android/avd/test.avd/config.ini

      - name: 🚀 Launch Emulator (max-debug)
        run: |
          echo "Killing stray adb..."
          pkill -9 adb || true
          adb kill-server || true
          sleep 3

          echo "--- Starting emulator ---"
          nohup emulator -avd test \
            -no-snapshot -no-audio -no-window \
            -no-boot-anim -gpu swiftshader_indirect \
            -no-metrics -verbose > emulator-log.txt 2>&1 &

          echo "Waiting for emulator to connect to ADB..."
          n=0
          until adb get-state >/dev/null 2>&1; do
            n=$((n+1))
            echo "[$n] Checking ADB state..."
            adb start-server || true
            sleep 5
            if [ $n -gt 30 ]; then
              echo "❌ ADB failed to connect after 150s."
              cat emulator-log.txt || true
              exit 1
            fi
          done

          echo "✅ ADB connected!"
          echo "Waiting for sys.boot_completed..."
          for i in $(seq 1 60); do
            boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "Boot status ($i): $boot_completed"
            [ "$boot_completed" = "1" ] && break
            sleep 10
          done

          if [ "$boot_completed" != "1" ]; then
            echo "❌ Emulator failed to boot."
            cat emulator-log.txt || true
            adb logcat -d > logcat.txt || true
            exit 1
          fi

          echo "✅ Emulator booted successfully!"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: 🧪 Run Instrumentation Tests
        run: ./gradlew connectedCheck --stacktrace

      - name: 📤 Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/
