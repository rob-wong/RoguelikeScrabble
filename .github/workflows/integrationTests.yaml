name: Android CI (Production with Heartbeat Debug)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  instrumentation-tests:
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install coreutils (for gtimeout)
        run: brew install coreutils

      - name: Set up Android SDK PATH
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        shell: bash

      - name: Install SDK components and Create AVD
        env:
          _JAVA_OPTIONS: "-XX:+IgnoreUnrecognizedVMOptions --add-modules java.xml.bind,java.xml.ws.annotation"
        run: |
          echo "y" | sdkmanager --install "system-images;android-30;google_apis;arm64-v8a" "emulator" "platform-tools"
          echo no | avdmanager create avd --force -n test --package "system-images;android-30;google_apis;arm64-v8a" --abi "google_apis/arm64-v8a"

      - name: Launch Emulator and Monitor in Background
        run: |
          echo "--- Starting Emulator in background with most stable options ---"
          
          # Use the most robust set of options for CI environments
          nohup emulator \
            -avd test \
            -no-snapshot \
            -no-window \
            -no-boot-anim \
            -no-audio \
            -camera-back none \
            -gpu auto \
            -verbose \
            > emulator-log.txt 2>&1 &
          
          # Give it a moment to ensure the process has started
          sleep 15
          
          # ✅ THE HEARTBEAT DEBUGGING LOOP ✅
          # This will give us live updates from inside the boot process.
          echo "--- Starting Heartbeat Debug Loop (Max 10 minutes) ---"
          success=false
          # Loop for 20 attempts, 30 seconds apart (10 minutes total)
          for i in {1..20}; do
            echo "--- Heartbeat Tick #$i ---"
          
            # 1. Check if emulator process is still alive
            if ! pgrep -fl emulator; then
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              echo "!!! CRITICAL: Emulator process has DIED. Crash detected. !!!"
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              success=false
              break
            fi
          
            # 2. Check the state of adb devices
            adb devices
          
            # 3. Check if the device is fully online ('device' state)
            # The 'grep -w' ensures we match the whole word 'device'
            if adb devices | grep -w 'emulator-5554' | grep -w 'device'; then
              echo "--- Emulator is online! Boot successful. ---"
              success=true
              break
            fi
          
            # 4. If not online, dump the tail of the log and wait
            echo "--- Emulator not yet online. Dumping latest log entries: ---"
            tail -n 50 emulator-log.txt
            echo "--- Waiting 30 seconds... ---"
            sleep 30
          done
          
          # Final check and log dump
          echo "--- Heartbeat loop finished. Dumping full log. ---"
          cat emulator-log.txt
          
          # Fail the job if the loop did not succeed
          if [ "$success" = false ]; then
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "!!! CRITICAL: Emulator failed to become ready in 10 minutes. !!!"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            exit 1
          else
            echo "--- Emulator booted successfully, disabling animations ---"
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
          fi

      - name: Run instrumentation tests
        run: ./gradlew connectedCheck

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/
