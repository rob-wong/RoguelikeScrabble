# This workflow runs your Android Instrumentation tests on a GitHub-hosted emulator

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  instrumentation-tests:
    # We can use the newer arm64 runners which are often faster
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Update the cache key to reflect the new architecture
      - name: AVD Caching
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/system-images/
          key: avd-30-arm64 # ✅ CHANGED cache key

      - name: Create and run Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          # ✅ 1. CHANGE THE TARGET: google_apis_playstore is often more compatible
          target: google_apis_playstore
          # ✅ 2. CHANGE THE ARCHITECTURE: Match the runner's ARM64 architecture
          arch: arm64-v8a
          profile: Nexus 6
          boot-timeout: 600
          script: |
            echo "Disabling animations to stabilize emulator..."
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
            echo "Emulator is ready."

      - name: Run instrumentation tests
        run: ./gradlew connectedCheck

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/
