name: Android CI (Production)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  instrumentation-tests:
    runs-on: macos-latest

    steps:
      - name: 🧩 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🧰 Install dependencies
        run: |
          brew install coreutils || true
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: ⚙️ Set up Android SDK
        run: |
          echo "--- Preparing Android SDK ---"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"

          echo "--- Downloading cmdline-tools ---"
          curl -sSL -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-mac-10406996_latest.zip
          unzip -q commandlinetools.zip
          rm commandlinetools.zip
          mv cmdline-tools latest

          # Append to GitHub’s PATH file (for later steps)
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

          # Also export for this step immediately
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "--- PATH setup complete ---"
          which sdkmanager || echo "sdkmanager NOT FOUND"
          sdkmanager --version || true

          echo "--- Accepting licenses ---"
          yes | sdkmanager --licenses || true

          echo "--- Installing core SDK components ---"
          sdkmanager --update
          sdkmanager "platform-tools" "emulator" "platforms;android-30" "system-images;android-30;google_apis;arm64-v8a"

          echo "--- Verifying installation ---"
          ls -R "$ANDROID_SDK_ROOT/system-images/android-30" || echo "System images missing!"
          ls "$ANDROID_SDK_ROOT/emulator" || echo "Emulator binaries missing!"
          echo "✅ Android SDK setup completed successfully"
      

      - name: 🧼 Kill all existing ADB daemons
        run: |
          echo "Killing any existing adb processes..."
          pkill -9 adb || true
          adb kill-server || true
          sleep 2
          echo "--- ADB versions found ---"
          which -a adb || true

      - name: 📱 Create and start AVD
        run: |
          echo no | avdmanager create avd --force -n test --package "system-images;android-30;google_apis;arm64-v8a" --abi arm64-v8a
          echo "--- Emulator config ---"
          cat ~/.android/avd/test.avd/config.ini

      - name: 🚀 Launch Android Emulator (headless, software mode)
        run: |
          echo "Creating AVD..."
          echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;arm64-v8a" --force || true
          echo "AVD created!"

          echo "Starting emulator..."
          $ANDROID_SDK_ROOT/emulator/emulator -avd test -no-window -no-snapshot -gpu swiftshader_indirect -accel off -noaudio -no-boot-anim &

          echo "Waiting for emulator to boot..."
          adb wait-for-device
          adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done;'
          echo "✅ Emulator booted successfully!"
      

      - name: 🧪 Run Instrumentation Tests
        run: ./gradlew connectedCheck --stacktrace

      - name: 📤 Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/
