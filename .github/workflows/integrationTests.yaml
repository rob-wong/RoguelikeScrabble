# This workflow runs your Android Instrumentation tests on a GitHub-hosted emulator

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  instrumentation-tests:
    # ✅ 1. USE THE STANDARD INTEL RUNNER: This is the most reliable and available runner.
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Update the cache key to reflect the x86 architecture
      - name: AVD Caching
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/system-images/
          # ✅ 2. UPDATE THE CACHE KEY to match the x86_64 architecture
          key: avd-30-x86_64

      - name: Create and run Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          # ✅ 3. USE AN INTEL (x86_64) EMULATOR to match the Intel runner
          arch: x86_64
          profile: Nexus 6
          # ✅ 4. FIX THE TYPO: Use the correct parameter name
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          # ✅ 5. USE THE BUILT-IN 'disable-animations' for reliability
          disable-animations: true
          script: echo "Emulator is ready. Animations were disabled by the action."

      - name: Run instrumentation tests
        run: ./gradlew connectedCheck

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/
