name: Android CI (Production)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  instrumentation-tests:
    runs-on: macos-latest

    steps:
      - name: 🧩 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🧰 Install dependencies
        run: |
          brew install coreutils || true
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: ⚙️ Set up Android SDK
        run: |
          echo "--- Preparing Android SDK ---"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"

          echo "--- Downloading cmdline-tools ---"
          curl -sSL -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-mac-10406996_latest.zip
          unzip -q commandlinetools.zip
          rm commandlinetools.zip
          mv cmdline-tools latest

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "--- Accepting licenses ---"
          yes | sdkmanager --licenses || true

          echo "--- Installing core SDK components ---"
          sdkmanager --update
          sdkmanager "platform-tools" "emulator" "platforms;android-30" "system-images;android-30;google_apis;arm64-v8a"

          echo "--- Verifying installation ---"
          ls "$ANDROID_SDK_ROOT/emulator" || echo "⚠️ Emulator binaries missing!"
          ls -R "$ANDROID_SDK_ROOT/system-images/android-30" || echo "⚠️ System image missing!"
          echo "✅ Android SDK setup completed"

      - name: 🧼 Kill all existing ADB daemons
        run: |
          echo "Killing any existing adb processes..."
          pkill -9 adb || true
          adb kill-server || true
          sleep 2
          which -a adb || echo "⚠️ adb not found"
          adb version || true

      - name: 📱 Create AVD (with hardware acceleration disabled)
        run: |
          echo "--- Creating AVD ---"
          echo "no" | avdmanager create avd -n test --package "system-images;android-30;google_apis;arm64-v8a" --force || true
          AVD_DIR="$HOME/.android/avd/test.avd"
          if [ -f "$AVD_DIR/config.ini" ]; then
            echo "✅ Found AVD config, patching it..."
            sed -i '' 's/^hw\.gpu=.*/hw.gpu=off/' "$AVD_DIR/config.ini" || true
            sed -i '' 's/^hw\.accel=.*/hw.accel=no/' "$AVD_DIR/config.ini" || true
            echo "hw.gpu=off" >> "$AVD_DIR/config.ini"
            echo "hw.accel=no" >> "$AVD_DIR/config.ini"
            echo "hw.cpu.ncore=2" >> "$AVD_DIR/config.ini"
            echo "hw.ramSize=2048" >> "$AVD_DIR/config.ini"
          else
            echo "⚠️ No AVD config found at $AVD_DIR"
          fi
          echo "--- Dumping AVD config ---"
          cat "$AVD_DIR/config.ini" || echo "⚠️ config.ini missing"

      - name: 🚀 Launch Android Emulator (full diagnostic mode)
        run: |
          echo "--- Starting emulator in pure software mode ---"
          nohup $ANDROID_SDK_ROOT/emulator/emulator \
            -avd test \
            -no-window \
            -no-audio \
            -no-snapshot \
            -gpu off \
            -accel off \
            -no-boot-anim \
            -no-metrics \
            -no-metrics-collection \
            -verbose \
            > emulator-log.txt 2>&1 &

          echo "Waiting for ADB device..."
          gtimeout 600 adb wait-for-device || {
            echo "❌ Emulator failed to appear via adb within 10 minutes"
            cat emulator-log.txt
            exit 1
          }

          echo "Checking boot progress..."
          boot_completed=""
          n=0
          until [ "$boot_completed" = "1" ] || [ $n -ge 60 ]; do
            sleep 10
            boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "Boot status: $boot_completed"
            n=$((n+1))
          done

          if [ "$boot_completed" != "1" ]; then
            echo "❌ Emulator failed to boot fully within 10 minutes."
            echo "--- emulator-log.txt ---"
            cat emulator-log.txt || echo "⚠️ No emulator log found"
            exit 1
          fi

          echo "✅ Emulator booted successfully!"
          adb devices
          adb shell getprop ro.build.fingerprint || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: 🧪 Run Instrumentation Tests
        run: ./gradlew connectedCheck --stacktrace

      - name: 📤 Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/
