# This workflow runs your Android Instrumentation tests on a GitHub-hosted emulator
name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  instrumentation-tests:
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ✅ DEBUG STEP 1: Check for hardware acceleration
      - name: Check Virtualization and Hardware Acceleration
        run: |
          echo "--- Checking system info for virtualization ---"
          sysctl kern.hv_support
          echo "--- Checking for HAXM/HVIF ---"
          ls -l /dev/HAXM
          ls -l /dev/hvif
          echo "--- Done checking ---"

      # ✅ DEBUG STEP 2: Install SDK components and list system images
      - name: Install Android SDK components
        run: |
          echo "y" | $ANDROID_HOME/tools/bin/sdkmanager --install "system-images;android-30;google_apis;x86_64"
          echo "--- Available system images ---"
          $ANDROID_HOME/tools/bin/sdkmanager --list | grep system-images
          echo "--- Done listing ---"

      - name: AVD Caching
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/system-images/
          key: avd-30

      - name: Create and run Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          boot-timeout: 600
          # ✅ DEBUG STEP 3: Enable verbose logging for the emulator action
          enable-verbose-logging: true
          script: |
            echo "Disabling animations to stabilize emulator..."
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
            echo "Emulator is ready."

      # ✅ DEBUG STEP 4: Manually check for connected devices
      - name: Check for connected devices
        if: always() # Run this step even if the previous one fails
        run: |
          echo "--- Running 'adb devices' ---"
          $ANDROID_HOME/platform-tools/adb devices
          echo "--- Done running 'adb devices' ---"

      - name: Run instrumentation tests
        run: ./gradlew connectedCheck

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/
