# This workflow runs your Android Instrumentation tests on a GitHub-hosted emulator

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  instrumentation-tests:
    runs-on: macos-latest # Emulators run better on macOS virtual machines

    steps:
      # 1. Check out the code from your repository
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Set up the Java environment (required for Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Set up Gradle caching for faster builds
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. AVD Caching: Cache the emulator system image for faster startup
      - name: AVD Caching
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/system-images/
          key: avd-30 # Use a key that matches your API level

      # 5. The core step: Create and run the emulator in the background
      - name: Create and run Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          # FIX 1: Increase the boot timeout significantly
          boot-timeout: 600 # 600 seconds = 10 minutes
          # FIX 2: Add script commands to prepare the environment
          script: |
            echo "Disabling animations to stabilize emulator..."
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
            echo "Emulator is ready."

      # 6. Run your instrumented tests!
      #    (Reverted to the direct command, removing the broken 'run-command' action)
      - name: Run instrumentation tests
        run: ./gradlew connectedCheck

      # 7. (Optional but recommended) Upload test reports
      - name: Upload test reports
        if: always() # This ensures reports are uploaded even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/

