name: Android Instrumentation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "system-images;android-34;google_apis_playstore;arm64-v8a"

      - name: 🧪 Run Instrumentation Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 4
          avd-name: test
          emulator-options: -no-snapshot -no-window -gpu off -noaudio
          disable-animations: true
          boot-timeout: 1800
          script: |
            echo "--- Checking devices ---"
            adb devices
            adb wait-for-device
            
            echo "--- Boot prop ---"
            adb shell getprop ro.build.version.sdk
            
            echo "--- Starting tests ---"
            chmod +x ./gradlew
            ./gradlew connectedDebugAndroidTest --stacktrace && break

            echo "--- Pulling test results ---"
            ls -R app/build/reports/androidTests || true
      
