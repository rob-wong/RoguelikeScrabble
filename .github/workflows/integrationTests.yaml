# This workflow runs your Android Instrumentation tests on a GitHub-hosted emulator

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  instrumentation-tests:
    # We are forced onto ARM, so let's be explicit about it if possible.
    # We will configure the emulator to work on ARM regardless.
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Update the cache key to reflect the arm64 architecture
      - name: AVD Caching
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/system-images/
          key: avd-30-arm64-v3 # Changed key to ensure a fresh cache

      - name: Create and run Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          # ✅ 1. USE AN ARM EMULATOR: We must match the ARM host.
          target: google_apis
          arch: arm64-v8a
          profile: Nexus 6
          emulator-boot-timeout: 600
          # ✅ 2. THE CRITICAL FIX: Add '-feature -Vulkan' to the emulator options.
          # This disables certain hardware features that are unsupported in the CI's ARM environment
          # and prevents the 'HVF error'.
          emulator-options: -no-snapshot -no-window -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: echo "Emulator is ready."

      - name: Run instrumentation tests
        run: ./gradlew connectedCheck

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/
