# This workflow runs your Android Instrumentation tests on a GitHub-hosted emulator

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  instrumentation-tests:
    # ✅ THE FINAL FIX: Use a runner with an ARM64 (Apple Silicon) CPU
    # The 'macos-14' runner is ARM-based. 'macos-latest' is currently Intel.
    runs-on: macos-14

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # The cache key should match the architecture
      - name: AVD Caching
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/system-images/
          key: avd-30-arm64

      - name: Create and run Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          # The target and architecture should match the ARM runner
          target: google_apis_playstore
          arch: arm64-v8a
          profile: Nexus 6
          boot-timeout: 600
          # We also need to add 'emulator-options' to disable host-side rendering,
          # which is a common fix for ARM-on-ARM emulation in CI.
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: |
            echo "Disabling animations to stabilize emulator..."
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
            echo "Emulator is ready."

      - name: Run instrumentation tests
        run: ./gradlew connectedCheck

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/
