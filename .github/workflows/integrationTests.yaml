name: Android CI (Production)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  instrumentation-tests:
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install coreutils (for gtimeout)
        run: brew install coreutils

      - name: Set up Android SDK PATH
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        shell: bash

      - name: Detect host architecture and set ABI
        id: arch
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            ABI="arm64-v8a"
          else
            ABI="x86_64"
          fi
          echo "Detected architecture: $ARCH"
          echo "Using ABI: $ABI"
          echo "ABI=$ABI" >> $GITHUB_ENV

      - name: Install SDK components and Create AVD
        env:
          _JAVA_OPTIONS: "-XX:+IgnoreUnrecognizedVMOptions --add-modules java.xml.bind,java.xml.ws.annotation"
        run: |
          echo "y" | sdkmanager --install "system-images;android-30;google_apis;$ABI" "emulator" "platform-tools"
          echo no | avdmanager create avd --force -n test --package "system-images;android-30;google_apis;$ABI" --abi "google_apis/$ABI"

          # Optional optimization for faster startup
          echo "hw.gpu.mode=off" >> ~/.android/avd/test.avd/config.ini
          echo "hw.ramSize=2048" >> ~/.android/avd/test.avd/config.ini

      - name: Launch Emulator and Wait for Boot
        timeout-minutes: 15
        run: |
          echo "--- Starting emulator ---"
          nohup emulator -avd test \
            -no-snapshot \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > emulator-log.txt 2>&1 &

          echo "Waiting for emulator to boot..."
          adb wait-for-device

          boot_completed=""
          n=0
          until [ "$boot_completed" = "1" ] || [ $n -ge 60 ]; do
            sleep 10
            boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "Boot status: $boot_completed"
            n=$((n+1))
          done

          if [ "$boot_completed" != "1" ]; then
            echo "❌ Emulator failed to boot within 10 minutes."
            cat emulator-log.txt
            exit 1
          fi

          echo "✅ Emulator booted successfully."
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run instrumentation tests
        run: ./gradlew connectedCheck --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/
