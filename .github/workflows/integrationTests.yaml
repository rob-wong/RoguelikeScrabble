name: Android Instrumentation Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  instrumentation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🧩 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: ⚙️ Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🧪 Run Instrumentation Tests
        id: instrumentation
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86
          profile: Nexus 4
          avd-name: test-avd
          emulator-options: "-no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect"
          disable-animations: true
          boot-timeout: 1200
          script: |
            echo "--- Devices ---"
            adb devices
            adb wait-for-device
            echo "--- Boot prop ---"
            adb shell getprop sys.boot_completed || true

            echo "--- Starting tests ---"
            for i in 1 2 3; do
              ./gradlew connectedDebugAndroidTest --stacktrace && break
              echo "⚠️ Test run failed, retrying in 30s ($i/3)..."
              sleep 30
            done

            echo "--- Pulling test results ---"
            ls -R app/build/reports/androidTests || true

      - name: 🧾 Capture Emulator Logs on Failure
        if: failure()
        run: |
          echo "=== Dumping emulator logcat ==="
          adb logcat -d > emulator-logcat.txt || echo "⚠️ Could not capture logcat"
          echo "=== Dumping system logs ==="
          adb shell dmesg > emulator-dmesg.txt || echo "⚠️ Could not capture dmesg"
          echo "=== Listing files for inspection ==="
          ls -lh emulator-*.txt || true

      - name: 📤 Upload Logs & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-artifacts
          path: |
            app/build/reports/androidTests/connected/
            emulator-logcat.txt
            emulator-dmesg.txt
