name: Android CI (Deep Debug)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  instrumentation-tests:
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ====================================================================
      # ===== SECTION 1: ANDROID SDK PATH SETUP (THE FIX) ==================
      # ====================================================================
      - name: ✅ Set up Android SDK PATH
        run: |
          echo "Adding Android SDK tools to PATH"
          # The ANDROID_SDK_ROOT variable is provided by the GitHub runner environment.
          # We add the required tool directories to the GITHUB_PATH.
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/tools/bin" >> $GITHUB_PATH
        shell: bash

      # ====================================================================
      # ===== SECTION 2: PRE-FLIGHT ENVIRONMENT CHECKS =====================
      # ====================================================================
      - name: ✅ DEBUG - Verify Paths and SDK Manager
        run: |
          echo "--- Verifying system PATH ---"
          echo $PATH
          echo "--- Checking sdkmanager location and version ---"
          which sdkmanager
          sdkmanager --version

      - name: ✅ DEBUG - Check System Resources & Arch
        run: |
          echo "--- Machine Architecture ---"
          uname -a
          echo "--- Disk Space ---"
          df -h

      # ====================================================================
      # ===== SECTION 3: EMULATOR LAUNCH & MONITORING ======================
      # ====================================================================
      - name: Install SDK components and Create AVD
        run: |
          # Now sdkmanager will be found correctly
          echo "y" | sdkmanager --install "system-images;android-30;google_apis;arm64-v8a" "emulator" "platform-tools"
          # Create AVD
          echo no | avdmanager create avd --force -n test --package "system-images;android-30;google_apis;arm64-v8a" --abi "google_apis/arm64-v8a"

      - name: Launch Emulator and Monitor in Background
        run: |
          echo "--- Starting Emulator in background ---"
          nohup emulator \
            -avd test \
            -no-snapshot \
            -no-window \
            -no-boot-anim \
            -feature -Vulkan \
            -verbose \
            > emulator-log.txt 2>&1 &
          
          # Give it a moment to create a process
          sleep 10
          
          echo "--- Waiting for emulator to boot (max 10 mins) ---"
          timeout 600 adb wait-for-device
          
          BOOT_RESULT=$?
          
          echo "--- Final ADB Devices Status ---"
          adb devices
          
          echo "--- Dumping emulator log ---"
          cat emulator-log.txt
          
          if [ $BOOT_RESULT -ne 0 ]; then
            echo "!!! CRITICAL: 'adb wait-for-device' timed out. Emulator is not responsive. !!!"
            exit 1
          fi

      # ====================================================================
      # ===== SECTION 4: TEST EXECUTION ====================================
      # ====================================================================
      - name: Run instrumentation tests
        run: ./gradlew connectedCheck

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: app/build/reports/androidTests/connected/
